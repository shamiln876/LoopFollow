name: 4. Build LoopFollow
run-name: Build native plate scanner (${{ github.ref_name }})
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-plate-testflight
  cancel-in-progress: false
jobs:
  build:
    name: Build and upload reviewed native scanner
    runs-on: xcode-27
    timeout-minutes: 70
    env:
      TEAMID: ${{ secrets.TEAMID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      # The existing lane imports the valid family certificate read-only. It can
      # provision profiles for LoopFollow, but cannot revoke/create certificates.
      USE_EXISTING_TRIO_CERTIFICATE: 'true'
      MATCH_READONLY: 'true'
      NATIVE_PLATE_SCANNER_REQUIRED: 'true'
      MINIMUM_BUILD_NUMBER: '24'
      WAIT_FOR_PROCESSING: 'true'
    steps:
      - name: Select released Xcode 27 SDK
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.app/Contents/Developer
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          [[ "$sdk_version" == 27.* ]] || { echo "iOS 27 SDK is required"; exit 1; }
      - name: Check out the dispatched source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Verify exact release source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Building exact source $GITHUB_SHA"
      - name: Exercise meal, photo and Bluetooth regressions
        run: |
          set -euo pipefail
          bash Scripts/test-smart-meal-core.sh
          bash Scripts/test-plate-scanner.sh
          swiftc LoopFollow/NearbySharing/NearbyPacket.swift Tests/Nearby/main.swift -o "$RUNNER_TEMP/cruise-nearby-tests"
          "$RUNNER_TEMP/cruise-nearby-tests"
      - name: Compile simulator app before signing
        run: |
          set -o pipefail
          xcodebuild -workspace LoopFollow.xcworkspace -scheme LoopFollow \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$RUNNER_TEMP/cruise-meal-simulator-build.log"
      - name: Install project dependencies
        run: bundle install
      - name: Suppress Match profile tables
        run: |
          table_path=$(bundle exec ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb
          test -f "$table_path"
          sed -i "" "/puts(Terminal::Table.new(params))/d" "$table_path"
      - name: Build using the existing certificate
        run: bundle exec fastlane build_LoopFollow
      - name: Verify native SDK and family app identity
        run: |
          python3 Scripts/verify-native-plate-ipa.py LoopFollow.ipa
      - name: Confirm release checks ran on the exact dispatched commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Simulator, meal, photo and Bluetooth verification completed for $GITHUB_SHA"
      - name: Upload to existing LoopFollow TestFlight app
        run: bundle exec fastlane release
      - name: Save build and distribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-plate-testflight
          path: |
            LoopFollow.ipa
            LoopFollow.app.dSYM.zip
            buildlog/
            native-plate-ipa-verification.json
